<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>体験応募フォーム | 初柔会西塾</title>
    <link rel="stylesheet" href="trial.css" />
</head>
<body>
    <div class="wrap">
        <header class="hero">
            <h1 class="title">体験応募フォーム</h1>
            <p class="sub">西塾柔道クラブの体験参加をご希望の方はこちらからお申し込みください。</p>

            <nav class="links">
                <a href="../../index.html">戻る</a>
            </nav>
        </header>

        <main class="card">
            <div id="msg" class="msg" aria-live="polite"></div>

            <!-- ✅ novalidate を削除（requiredを効かせる） -->
            <form id="trialForm" class="form">
                <!-- 保護者 -->
                <h2 class="section-title">保護者情報</h2>

                <div class="grid">
                    <label class="field">
                        <span class="label">保護者氏名 <b class="req">必須</b></span>
                        <input type="text" name="guardian_name" autocomplete="name" required maxlength="100" placeholder="例）西塾 太郎" />
                    </label>

                    <label class="field">
                        <span class="label">電話番号（任意）</span>
                        <input type="tel" name="phone" autocomplete="tel" maxlength="30" placeholder="例）090-1234-5678" />
                    </label>

                    <label class="field">
                        <span class="label">メール <b class="req">必須</b></span>
                        <input type="email" name="email" autocomplete="email" required maxlength="255" placeholder="例）example@gmail.com" />
                    </label>

                    <label class="field">
                        <span class="label">希望日（任意）</span>
                        <input type="text" name="preferred_date" maxlength="50" placeholder="例）2/10（土）夕方希望" />
                    </label>
                </div>

                <!-- 人数 -->
                <h2 class="section-title">参加人数</h2>
                <div class="inline">
                    <label class="field">
                        <span class="label">人数 <b class="req">必須</b></span>
                        <select id="countSelect" name="count" required>
                            <option value="1">1人</option>
                            <option value="2">2人</option>
                            <option value="3">3人</option>
                            <option value="4">4人</option>
                        </select>
                    </label>
                    <p class="hint">※ 兄弟で参加する場合も1回で送れます</p>
                </div>

                <!-- 参加者 -->
                <h2 class="section-title">参加者情報</h2>
                <div id="participants"></div>

                <!-- 備考 -->
                <h2 class="section-title">備考（任意）</h2>
                <label class="field field-full">
                    <span class="label">備考（全体）</span>
                    <textarea name="message" rows="6" maxlength="2000" placeholder="例）兄弟で参加 / 初心者 / 不安点 など"></textarea>
                </label>

                <div class="actions">
                    <button id="submitBtn" class="btn" type="submit">送信する</button>
                    <button class="btn ghost" type="reset" id="resetBtn">リセット</button>
                </div>

                <p class="note">
                    送信内容は、体験日程の調整にのみ利用します。
                </p>
            </form>
        </main>

        <footer class="footer">
            <small>© Nishijuku Judo Club</small>
        </footer>
    </div>

    <script src="trial.js"></script>
</body>
</html>

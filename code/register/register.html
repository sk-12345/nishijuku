<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>新規アカウント作成 | 西塾柔道クラブ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="register.css" />
</head>
<body>

    <div class="register-wrapper">
        <div class="register-box">

            <h2>新規アカウント作成</h2>

            <p id="msg" class="msg" style="display:none;"></p>

            <form action="register_process.php" method="POST" id="regForm">
                <label>ログインID</label>
                <input type="text" name="login_id" required>

                <label>名前</label>
                <input type="text" name="name" required>

                <label>パスワード</label>
                <input type="password" name="password" required>

                <fieldset id="permissionFieldset" disabled>
                    <legend>権限</legend>
                    <label><input type="checkbox" name="system_flg" value="1" id="systemFlag"> システム</label>
                    <label><input type="checkbox" name="create_account_flg" value="1"> アカウント作成</label>
                    <label><input type="checkbox" name="account_flg" value="1"> アカウント管理</label>
                    <label><input type="checkbox" name="update_confirmation_flg" value="1"> 更新履歴</label>
                    <label><input type="checkbox" name="practice_flg" value="1"> 練習</label>
                    <label><input type="checkbox" name="game_flg" value="1"> 試合</label>
                    <label><input type="checkbox" name="event_flg" value="1"> イベント</label>
                </fieldset>

                <button type="submit">作成</button>
            </form>

            <a href="../home/home.html">← ホームへ戻る</a>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>

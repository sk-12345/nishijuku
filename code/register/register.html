<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>新規アカウント作成 | 初柔会西塾</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="register.css" />
</head>
<body>

    <div class="register-wrapper">
        <div class="register-box">

            <h2 data-koumoku-id ="register_accountCreate"></h2>

            <p id="msg" class="msg" style="display:none;"></p>

            <form action="register_process.php" method="POST" id="regForm">
                <label data-koumoku-id ="common_loginId"></label>
                <input type="text" name="login_id" required>

                <label data-koumoku-id ="common_name"></label>
                <input type="text" name="name" required>

                <label data-koumoku-id="common_pass"></label>
                <input type="password" name="password" required>

                <fieldset id="permissionFieldset" disabled>
                    <legend data-koumoku-id="register_kengen"></legend>
                    <div id="permissionList"></div>
                </fieldset>

                <button type="submit" data-button-id="common_submit"></button>
            </form>

            <a href="../home/home.html" data-koumoku-id ="common_homeBack"></a>
        </div>
    </div>

    <script src="register.js"></script>
    <script src="../ui_master.js"></script>
</body>
</html>

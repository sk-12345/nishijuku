<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アカウント管理 | 初柔会西塾</title>
    <link rel="stylesheet" href="account.css" />
</head>
<body>

    <div class="account-wrapper">
        <h2 data-koumoku-id="account_accountKanri"></h2>

        <p class="back"><a href="../home/home.html" data-koumoku-id ="common_homeBack"></a></p>

        <div class="table-wrap">
            <table class="account-table">
                <thead>
                    <tr>
                        <th data-koumoku-id="common_loginId"></th>
                        <th data-koumoku-id="common_name"></th>
                        <th data-koumoku-id="common_pass"></th>
                        <th data-koumoku-id="common_sakujo"></th>
                    </tr>
                </thead>
                <tbody id="accountTbody">
                    <tr>
                        <td colspan="4" data-message-id="common_yomikomi"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="account.js"></script>
    <script src="../ui_master.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>試合投稿 | 西塾柔道クラブ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="game_post.css">
</head>

<body>

    <div class="game-wrapper">

        <h2 class="page-title">試合投稿（ログイン必須）</h2>

        <div class="back-links">
            <a href="../home/home.html">ホームに戻る</a>
        </div>

        <div id="postArea" class="form-box" style="display:none;">

            <form id="postForm">

                <input type="hidden" name="edit_id" id="editId">

                <label>タイトル</label>
                <input type="text" name="title" required>

                <label>コメント</label>
                <textarea name="description" rows="4" required></textarea>

                <label>写真（複数選択可）</label>
                <input type="file"
                       name="images[]"
                       accept="image/*"
                       multiple
                       id="imageInput"
                       required>

                <div id="imagePreviewArea"></div>

                <button type="submit"
                        class="post-btn"
                        id="submitBtn">
                    投稿
                </button>

                <button type="button"
                        class="cancel-btn"
                        id="cancelEditBtn"
                        style="display:none;">
                    編集キャンセル
                </button>

            </form>

            <p id="postMsg"></p>

        </div>

        <h2 class="page-title">試合一覧</h2>

        <div id="gameGrid" class="game-grid">
            <p>読み込み中...</p>
        </div>

    </div>

    <script src="game_post.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">

    <title>試合投稿 | 西塾柔道クラブ</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="practice_post.css">
    <link rel="stylesheet" href="../photo_selection.css">

</head>

<body>

    <div class="practice-wrapper">

        <h2 class="page-title">
            試合投稿（ログイン必須）
        </h2>

        <div class="back-links">
            <a href="../home/home.html">
                ホームに戻る
            </a>
        </div>


        <div id="postArea"
             class="form-box"
             style="display:none;">


            <form id="postForm">

                <label>
                    タイトル
                </label>

                <input type="text"
                       name="title"
                       required>


                <label>
                    コメント
                </label>

<textarea name="description"
          rows="4"
          required></textarea>


                <label>
                    写真（複数選択可）
                </label>

                <input type="file"
                       name="images[]"
                       accept="image/*"
                       multiple
                       id="imageInput">


                <p class="photo-help">選択した写真を確認し、「前へ」「後ろへ」で掲載順を変更できます。</p>
                <div id="imageCommentArea" class="selected-photo-list"></div>


                <button type="submit"
                        class="post-btn">
                    投稿
                </button>

            </form>

            <p id="postMsg"></p>

        </div>


        <h2 class="page-title">
            試合一覧
        </h2>


        <div id="practiceGrid"
             class="practice-grid">

            <p>読み込み中...</p>

        </div>

    </div>

    <script src="../photo_selection.js"></script>
    <script src="practice_post.js"></script>

</body>
</html>
